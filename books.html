
<!DOCTYPE html>
<html>
<head>
    <title>Retrieve and Display JSON Data</title>
</head>
<body>

    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstBook"></p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor"></p>

    <h2>Book Genres</h2>
    <div id="bookGenres"></div>

    <p id="errorMessage" style="color: red;"></p>

    <script>
        async function loadBooks() 
        {
            try 
            {
                // retrieve JSON file
                const response = await fetch("books.json");

                // check if request was successful
                if (!response.ok) 
                {
                    throw new Error("Unable to load the books data.");
                }

                // convert JSON data into JavaScript object
                const data = await response.json();

                // get information needed 
                const firstBook = data.books[0];
                const secondBook = data.books[1];

                // display first book title
                document.getElementById("firstBook").textContent = firstBook.title;

                // display second book author
                document.getElementById("secondAuthor").textContent = secondBook.author;

                // display both genres
                const bookGenres = document.getElementById("bookGenres");

                data.books.forEach(function(book) 
                {
                    const paragraph = document.createElement("p");

                    paragraph.textContent = book.title + " — " + book.genres.join(", ");

                    bookGenres.appendChild(paragraph);
                });

            } 
            
            catch (error) 
                {
                    document.getElementById("errorMessage").textContent = "Error: Unable to retrieve book information. Please check the JSON file.";
                }
        }

        // call function
        loadBooks();
    </script>

</body>
</html>
